<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ezel — Papatya Falı</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="pages.css">
    <link rel="stylesheet" href="papatya.css">
</head>

<body>

    <div class="ambient ambient-one"></div>
    <div class="ambient ambient-two"></div>
    <div class="noise"></div>

    <div class="wrap">

        <header class="site-header">
            <a href="home.html" class="brand">EZEL</a>
            <nav class="nav">
                <a href="home.html">Ana Sayfa</a>
                <a href="gallery.html">Galeri</a>
                <a href="letter.html">Mektup</a>
                <a href="papatya.html" aria-current="page">Papatya</a>
                <a href="index.html">Çıkış</a>
            </nav>
        </header>

        <h1 class="page-title">Papatya Falı</h1>
        <p class="page-lead">Bir yaprak kopar, gerisini papatya bilsin.</p>
        <div class="rule"></div>

        <div id="papatya-oyunu">
            <div id="fal-mesaji">Bir yaprak kopar!</div>

            <div class="papatya">
                <div class="merkez"></div>
                <div class="yaprak" style="transform: rotate(0deg);"></div>
                <div class="yaprak" style="transform: rotate(40deg);"></div>
                <div class="yaprak" style="transform: rotate(80deg);"></div>
                <div class="yaprak" style="transform: rotate(120deg);"></div>
                <div class="yaprak" style="transform: rotate(160deg);"></div>
                <div class="yaprak" style="transform: rotate(200deg);"></div>
                <div class="yaprak" style="transform: rotate(240deg);"></div>
                <div class="yaprak" style="transform: rotate(280deg);"></div>
                <div class="yaprak" style="transform: rotate(320deg);"></div>
            </div>

            <button type="button" class="papatya-reset" id="papatya-reset">Tekrar</button>
        </div>

    </div>

    <footer class="site-footer">PRIVATE • 2026</footer>

    <script src="papatya.js"></script>

</body>
</html>
