<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hızlı Giriş</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="video-bg" aria-hidden="true">
        <div id="bgPlayer"></div>
    </div>

    <main class="login-container">
        <div class="login-card">
            <h1>Hızlı Giriş</h1>
            
            <form id="loginForm">
                <div class="input-group">
                    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                        <circle cx="12" cy="7" r="4"></circle>
                    </svg>
                    <input type="text" id="username" placeholder="Kullanıcı Adı (E-posta)">
                </div>

                <div class="input-group">
                    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                    </svg>
                    <input type="password" id="password" placeholder="Şifre">
                </div>

                <div class="forgot-password">
                    <a href="#">Şifremi Unuttum?</a>
                </div>

                <button type="submit" class="login-button">Giriş Yap</button>

                <div class="register-link">
                    Henüz üye değil misiniz? <a href="#">Kaydolun</a>
                </div>
            </form>
        </div>
        
        <div class="scroll-down">
            <svg class="mouse-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="5" y="2" width="14" height="20" rx="7" ry="7"></rect>
                <line x1="12" y1="6" x2="12" y2="10"></line>
            </svg>
            <span>Aşağı Kaydır</span>
            <svg class="chevron-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="6 9 12 15 18 9"></polyline>
            </svg>
        </div>
    </main>
    <script src="https://www.youtube.com/iframe_api"></script>
    <script src="bg-video.js"></script>
    <script src="script.js"></script>
</body>
</html>
